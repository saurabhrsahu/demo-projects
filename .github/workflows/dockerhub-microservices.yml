name: Build and Push Microservices to Docker Hub

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test Docker Hub login
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ env.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Node microservice image
        uses: docker/build-push-action@v5
        with:
          context: ./node-microservice
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/node-microservice:latest
            ${{ env.DOCKERHUB_USERNAME }}/node-microservice:${{ github.sha }}

      - name: Build and push Python microservice image
        uses: docker/build-push-action@v5
        with:
          context: ./python-microservice
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/python-microservice:latest
            ${{ env.DOCKERHUB_USERNAME }}/python-microservice:${{ github.sha }}

