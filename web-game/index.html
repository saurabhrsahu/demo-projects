<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Web Game Demo</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="header">
      <div class="title">
        <div class="name">Web Game Demo</div>
        <div class="subtitle">Tiny canvas game for ArgoCD testing</div>
      </div>
      <div class="chips">
        <span class="chip">WASD / Arrow keys</span>
        <span class="chip">Collect squares</span>
      </div>
    </header>

    <main class="main">
      <section class="panel">
        <div class="stats">
          <div class="stat"><span class="label">Score</span><span id="score" class="value">0</span></div>
          <div class="stat"><span class="label">Best</span><span id="best" class="value">0</span></div>
          <div class="stat"><span class="label">Time</span><span id="time" class="value">0.0s</span></div>
        </div>
        <div class="actions">
          <button id="restart" class="btn" type="button">Restart</button>
          <button id="pause" class="btn secondary" type="button">Pause</button>
        </div>
      </section>

      <section class="game">
        <canvas id="game" width="960" height="540" aria-label="Game canvas"></canvas>
        <div class="hint">
          Tip: if you're deploying this, expose it via Service port 80.
        </div>
      </section>
    </main>

    <footer class="footer">
      <span>Image: <code>saurabhrsahu/demo-apps:game</code></span>
      <span class="dot">·</span>
      <a href="/healthz">healthz</a>
    </footer>

    <script src="./app.js"></script>
  </body>
</html>
