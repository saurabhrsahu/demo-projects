# ApplicationSet: one Argo CD Application per folder under demo/ (except demo/apps bootstrap).
# Parameters come from the git directory generator:
#   path          e.g. demo/node-app
#   path.basename e.g. node-app
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: demo-workloads
  namespace: argocd
spec:
  generators:
  - git:
      repoURL: https://github.com/saurabhrsahu/demo-projects.git
      revision: HEAD
      directories:
      - path: demo/*
      - path: demo/apps
        exclude: true
  template:
    metadata:
      name: demo-{{path.basename}}
    spec:
      project: default
      source:
        repoURL: https://github.com/saurabhrsahu/demo-projects.git
        targetRevision: HEAD
        path: "{{path}}"
      destination:
        server: https://kubernetes.default.svc
        namespace: demo
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - CreateNamespace=true
