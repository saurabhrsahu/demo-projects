apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-node
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/saurabhrsahu/demo-projects.git
    targetRevision: HEAD
    path: node-microservice
  destination:
    server: https://kubernetes.default.svc
    namespace: demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
