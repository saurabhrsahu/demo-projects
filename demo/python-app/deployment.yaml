apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-python
  namespace: demo
  labels:
    app: demo-python
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-python
  template:
    metadata:
      labels:
        app: demo-python
    spec:
      containers:
      - name: demo-python
        image: saurabhrsahu/demo-apps:python
        ports:
        - containerPort: 5000
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
